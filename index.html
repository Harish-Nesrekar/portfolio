/* =====================================================================
   PORTFOLIO 3D UPGRADE — paste inside a <script> tag AFTER your main script
   Adds: cursor-tracking head & eyes, cursor-reactive particle field,
   cursor spotlight, orbiting tech-stack labels, click ripples, hover pop,
   typed role text, 3D card tilt, scroll reveals, scroll progress bar.
   ===================================================================== */
const FX = { t: 0, cursor: new THREE.Vector3(0, 1.4, 1), hover: new Map() };

function initFX() {
  /* ---------- styles for the extras ---------- */
  const st = document.createElement('style');
  st.textContent = `
    .executive-card-hover{transition:border-color .28s,box-shadow .28s!important;will-change:transform}
    .executive-card-hover:hover{transform:none}
    #scroll-bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
      background:linear-gradient(90deg,#2f81f7,#3fb950,#d29922)}
    #typed::after{content:'|';margin-left:2px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}`;
  document.head.appendChild(st);
  const bar = document.createElement('div'); bar.id = 'scroll-bar'; document.body.appendChild(bar);
  addEventListener('scroll', () => {
    const h = document.documentElement;
    bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  });

  /* ---------- typed roles in hero badge ---------- */
  const badge = [...document.querySelectorAll('#hero span')]
    .find(s => s.textContent.includes('Software Engineering'));
  if (badge) {
    badge.id = 'typed';
    const roles = ['Software Engineer', 'DSA Problem Solver', 'Full-Stack Developer', 'Building GitBug AI'];
    let r = 0, i = 0, del = false;
    (function tick() {
      const w = roles[r];
      badge.textContent = w.slice(0, i);
      i += del ? -1 : 1;
      let d = del ? 35 : 75;
      if (!del && i > w.length) { del = true; d = 1400; }
      else if (del && i < 0) { del = false; r = (r + 1) % roles.length; d = 300; }
      setTimeout(tick, d);
    })();
  }

  /* ---------- particle field that flees the cursor ---------- */
  const N = 800, pos = new Float32Array(N * 3), base = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    base[i*3] = (Math.random() - .5) * 12;
    base[i*3+1] = Math.random() * 5;
    base[i*3+2] = (Math.random() - .5) * 12;
  }
  pos.set(base);
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  FX.pts = new THREE.Points(pg, new THREE.PointsMaterial({
    color: 0x58a6ff, size: 0.035, transparent: true, opacity: .75, depthWrite: false
  }));
  FX.base = base; scene.add(FX.pts);

  /* ---------- cursor spotlight (a light that follows your mouse) ---------- */
  FX.light = new THREE.PointLight(0x58a6ff, 1.6, 3.5);
  scene.add(FX.light);

  /* ---------- orbiting tech-stack labels ---------- */
  FX.orbit = new THREE.Group(); FX.orbit.position.set(0, 1.55, 0); scene.add(FX.orbit);
  const techs = [['React','#61dafb'],['TypeScript','#3178c6'],['C++','#659ad2'],['Java','#f89820'],
                 ['Node.js','#68a063'],['Git','#f05032'],['Tailwind','#38bdf8'],['DSA','#3fb950']];
  techs.forEach(([name, col], i) => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 80;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(13,17,23,.9)'; x.strokeStyle = col; x.lineWidth = 3;
    x.beginPath(); x.roundRect(4, 4, 248, 72, 20); x.fill(); x.stroke();
    x.fillStyle = col; x.font = 'bold 32px monospace'; x.textAlign = 'center';
    x.fillText(name, 128, 52);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    s.scale.set(.5, .16, 1); s.userData.i = i; FX.orbit.add(s);
  });

  /* ---------- click ripple on the floor + sparks ---------- */
  addEventListener('click', e => {
    if (e.clientY > innerHeight * .94 || e.target.closest('#inspector-modal')) return;
    const hit = new THREE.Vector3();
    raycaster.setFromCamera(mouse, camera);
    if (!raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) return;
    const ring = new THREE.Mesh(new THREE.RingGeometry(.08, .1, 48),
      new THREE.MeshBasicMaterial({ color: 0x58a6ff, transparent: true, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(hit.x, .02, hit.z); scene.add(ring);
    gsap.to(ring.scale, { x: 14, y: 14, duration: 1.2, ease: 'power2.out' });
    gsap.to(ring.material, { opacity: 0, duration: 1.2, onComplete: () => scene.remove(ring) });
  });

  /* ---------- 3D tilt on cards ---------- */
  document.querySelectorAll('.executive-card-hover').forEach(el => {
    el.addEventListener('mousemove', e => {
      const b = el.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width - .5, py = (e.clientY - b.top) / b.height - .5;
      gsap.to(el, { rotationY: px * 10, rotationX: -py * 10, y: -4, transformPerspective: 800, duration: .4 });
    });
    el.addEventListener('mouseleave', () =>
      gsap.to(el, { rotationX: 0, rotationY: 0, y: 0, duration: .6, ease: 'power3.out' }));
  });

  /* ---------- scroll reveals ---------- */
  if (window.ScrollTrigger) {
    gsap.registerPlugin(ScrollTrigger);
    document.querySelectorAll('#projects .executive-card, #stats .executive-card, #about .executive-card, #contact .executive-card')
      .forEach(el => gsap.from(el, {
        y: 50, opacity: 0, duration: .8, ease: 'power3.out',
        scrollTrigger: { trigger: el, start: 'top 90%', once: true }
      }));
    // 3D camera drifts as you scroll away from the hero
    ScrollTrigger.create({
      trigger: '#hero', start: 'top top', end: 'bottom top', scrub: true,
      onUpdate: s => { FX.scroll = s.progress; }
    });
  }
}

/* Call once per frame from animate() */
function updateFX() {
  if (!FX.pts) return;
  FX.t += 0.016;
  const t = FX.t;

  // cursor in 3D space (plane in front of the desk)
  raycaster.setFromCamera(mouse, camera);
  const p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), -.6), p)) FX.cursor.lerp(p, .15);
  FX.light.position.copy(FX.cursor);

  // particles: drift + repel from cursor
  const a = FX.pts.geometry.attributes.position, b = FX.base;
  for (let i = 0; i < a.count; i++) {
    let x = b[i*3] + Math.sin(t * .4 + i) * .15;
    let y = b[i*3+1] + Math.cos(t * .5 + i * .7) * .15;
    let z = b[i*3+2];
    const dx = x - FX.cursor.x, dy = y - FX.cursor.y, dz = z - FX.cursor.z;
    const d = Math.hypot(dx, dy, dz);
    if (d < 1.2) { const f = (1.2 - d) / d * .9; x += dx * f; y += dy * f; z += dz * f; }
    a.setXYZ(i, x, y, z);
  }
  a.needsUpdate = true;
  FX.pts.rotation.y = t * .02;

  // orbiting labels
  FX.orbit.children.forEach(s => {
    const ang = t * .45 + s.userData.i * Math.PI * 2 / FX.orbit.children.length;
    s.position.set(Math.cos(ang) * 2.1, Math.sin(t * .8 + s.userData.i) * .18, Math.sin(ang) * 1.5);
  });

  // programmer follows your cursor with head + eyes
  const r = window.__rig;
  if (r) {
    r.headGroup.rotation.y += (-mouse.x * .6 - r.headGroup.rotation.y) * .08;
    r.headGroup.rotation.x += (.09 + mouse.y * .3 - r.headGroup.rotation.x) * .08;
    [r.irisL, r.irisR].forEach(m => { m.position.x += ((m === r.irisL ? -.052 : .052) - mouse.x * .01 - m.position.x) * .1; });
  }

  // interactive objects pop when hovered
  interactiveObjects.forEach(o => {
    const target = (o === hoveredObject) ? 1.08 : 1;
    o.scale.x += (target - o.scale.x) * .15;
    o.scale.y += (target - o.scale.y) * .15;
  });

  // gentle scroll-driven fade of the 3D scene
  if (FX.scroll !== undefined) renderer.domElement.style.opacity = 1 - FX.scroll * .8;
}
